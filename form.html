<!DOCTYPE html>
<html lang="en">
<head>

    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Clash Display', sans-serif;
            background-color: #080808;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 1.5rem;
            z-index: 100;
            position: relative;
            background-color: rgba(8, 8, 8, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-icon {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button {
            padding: 8px 16px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Clash Display', sans-serif;
            font-weight: 500;
            font-size: 0.875rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .title-container {
            position: relative;
            z-index: 100;
            text-align: center;
            padding: 2rem 1rem;
            background-color: rgba(8, 8, 8, 0.95);
            width: 100%;
        }

        .form-title {
            font-family: 'Clash Display', sans-serif;
            font-weight: 300;
            font-size: 2.5rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            text-align: center;
            background: linear-gradient(to right, #fff, rgba(203, 255, 77, 0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .form-description {
            font-size: 1.125rem;
            line-height: 1.5;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            max-width: 640px;
            margin: 0 auto;
        }

        .form-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100vh - 170px); /* Subtract header + title section height */
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .title-container {
                padding: 1.5rem 1rem;
            }

            .form-title {
                font-size: 2rem;
            }

            .form-description {
                font-size: 1rem;
            }
            
            .form-container {
                height: calc(100vh - 150px);
            }
        }

        /* Fade in animation for content */
        .fade-in {
            opacity: 0;
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="header fade-in delay-1">

                <defs>

            </svg>
        </div>
        <a href="index.html" class="back-button">

            Back to home

    </div>
    
    <div class="title-container fade-in delay-2">
        <h1 class="form-title">Meenaviyal Waiting List</h1>

    </div>
    
    <div class="form-container">
        <iframe data-tally-src="https://tally.so/r/nGQZdO" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Meenaviyal Waiting List"></iframe>
    </div>
</body>
</html>
