<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meenaviyal - Where makers gather, while AI evolves</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cabinet+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/css?f[]=clash-display@200,300,400,500,600,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Clash Display', sans-serif;
            background-color: #080808;
            color: rgba(255, 255, 255, 0.9);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(120, 220, 60, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(80, 100, 240, 0.08) 0%, transparent 40%);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='rgba(255,255,255,0.02)' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6rem;
        }

        .logo-icon {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-text {
            font-family: 'Clash Display', sans-serif;
            font-weight: 500;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }

        h1 {
            font-family: 'Clash Display', sans-serif;
            font-weight: 300;
            font-size: clamp(2.5rem, 6vw, 3.2rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            text-align: center;
            background: linear-gradient(to right, #fff, rgba(203, 255, 77, 0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .hero-text {
            font-size: 1.125rem;
            line-height: 1.5;
            margin-bottom: 3rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            max-width: 520px;
        }

        .waitlist-form {
            display: flex;
            width: 100%;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }

        .input-icon {
            padding: 0 16px;
            opacity: 0.5;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 0 16px 0;
            color: white;
            font-family: 'Clash Display', sans-serif;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button {
            padding: 0 20px;
            border-radius: 8px;
            background-color: #CBFF4D;
            color: #080808;
            font-family: 'Clash Display', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            background-color: #d8ff7a;
            transform: translateY(-2px);
        }

        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(203, 255, 77, 0.08) 0%, transparent 70%);
            top: -250px;
            right: -250px;
            z-index: -1;
            filter: blur(50px);
        }

        .glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(94, 206, 123, 0.05) 0%, transparent 70%);
            bottom: -300px;
            left: -300px;
            z-index: -1;
            filter: blur(80px);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 0 1rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .hero-text {
                font-size: 1rem;
            }

            .waitlist-form {
                flex-direction: column;
                gap: 1rem;
            }

            button {
                padding: 16px;
                width: 100%;
            }

            .header {
                margin-bottom: 4rem;
            }
        }

        /* Animated underscore cursor effect */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: #CBFF4D;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Fade in animation for content */
        .fade-in {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }

        .tooltip-trigger {
  position: relative;
  cursor: pointer;
  color: #CBFF4D;
  transition: color 0.2s;
}

.tooltip-trigger::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(5px);
  background-color: #CBFF4D;
  color: #080808;
  font-size: 0.75rem;
  font-weight: 500;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, transform 0.3s;
  z-index: 10;
}

.tooltip-trigger:hover::after {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(-5px);
}

/* Optional arrow pointing down */
.tooltip-trigger::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  border-width: 5px;
  border-style: solid;
  border-color: #CBFF4D transparent transparent transparent;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, transform 0.3s;
  z-index: 10;
}

.tooltip-trigger:hover::before {
  opacity: 1;
  visibility: visible;
}
    </style>
</head>
<body>
    <div class="grid-pattern"></div>
    <div class="glow"></div>
    <div class="glow-2"></div>
    
    <div class="container">
        <div class="header fade-in delay-1">
            <div class="logo-icon">
                <svg width="162" height="80" viewBox="0 0 162 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M135.254 26.1733L153.977 40L104.991 76.1743L107.834 80L162 40L137.954 22.2428C137.325 23.7316 136.4 25.0661 135.254 26.1733ZM116.321 12.1925C117.059 10.7602 118.08 9.49663 119.31 8.47495L107.834 0L104.991 3.82566L116.321 12.1925ZM17.11 39.3605V40.6394L0 57.697L2.70146 60.3902L21.2441 41.9043H40.5102V59.0436H44.3306V41.9043H64.3879V59.0436H68.2083V41.9043H88.2656V59.0436H92.086V41.9043H126.47V38.0956H92.086V20.9564H88.2656V38.0956H68.2083V20.9564H64.3879V38.0956H44.3306V20.9564H40.5102V38.0956H21.2441L2.70146 19.6098L0 22.303L17.11 39.3605ZM126.947 24.7651C130.904 24.7651 134.111 21.5678 134.111 17.6238C134.111 13.6797 130.904 10.4824 126.947 10.4824C122.991 10.4824 119.784 13.6797 119.784 17.6238C119.784 21.5678 122.991 24.7651 126.947 24.7651Z" fill="url(#paint0_linear_4_57)" fill-opacity="0.9"/>
                    <defs>
                    <linearGradient id="paint0_linear_4_57" x1="61.5225" y1="40" x2="161.809" y2="40" gradientUnits="userSpaceOnUse">
                    <stop stop-color="white"/>
                    <stop offset="1" stop-color="#CBFF48"/>
                    </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>
        
        <h1 class="fade-in delay-2">Where makers gather, while AI evolves<span class="typing-cursor"></span></h1>
        <p class="hero-text fade-in delay-2">
            <span class="tooltip-trigger" data-tooltip="Malayalam slang word for Meanwhile ">Meenaviyal</span> is where the curious gather — a small community
            of creators tinkering at the edges of AI possibility. We value meaningful connections and the joy of exploration.
          </p>
        
        <form class="waitlist-form fade-in delay-3" id="waitlist-form">
            <div class="input-wrapper">
                <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                </div>
                <input type="email" placeholder="Enter your email address" required>
            </div>
            <button type="submit">Join waitlist</button>
        </form>
    </div>

    <script>
        // Form submission handling
        const form = document.getElementById('waitlist-form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const button = form.querySelector('button');
            const originalText = button.innerText;
            
            // Simulate form submission
            button.innerText = 'Processing...';
            
            setTimeout(() => {
                button.innerText = 'Added to waitlist!';
                form.reset();
                
                setTimeout(() => {
                    button.innerText = originalText;
                }, 3000);
            }, 1500);
        });

        // Cursor effect for terminal style
        const typingCursor = document.querySelector('.typing-cursor');
        setTimeout(() => {
            if (typingCursor) {
                typingCursor.style.animation = 'blink 1s step-end infinite';
            }
        }, 2000);
    </script>
</body>
</html>
