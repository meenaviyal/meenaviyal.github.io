        .container {

            font-size: 1rem;
            font-weight: 500;

            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);

            color: #CBFF4D;
        }

        .logo-icon {

        }

            letter-spacing: -0.02em;

            font-size: clamp(2.5rem, 6vw, 3.2rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            text-align: center;
            background: linear-gradient(to right, #fff, rgba(203, 255, 77, 0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .hero-text {
            font-size: 1.125rem;
            line-height: 1.5;
            margin-bottom: 3rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            max-width: 520px;
        }

        .cta-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 3rem;
        }

        button, .cta-button {
            padding: 16px 36px;
            border-radius: 8px;
            background-color: #CBFF4D;
            color: #080808;
            font-family: 'Clash Display', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        button:hover, .cta-button:hover {
            background-color: #d8ff7a;
            transform: translateY(-2px);
        }

        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(203, 255, 77, 0.08) 0%, transparent 70%);
            top: -250px;
            right: -250px;
            z-index: -1;
            filter: blur(50px);
        }

        .glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(94, 206, 123, 0.05) 0%, transparent 70%);
            bottom: -300px;
            left: -300px;
            z-index: -1;
            filter: blur(80px);
        }

        footer {
            margin-top: auto;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.5);
            width: 100%;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 0 1rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .hero-text {
                font-size: 1rem;
            }

            .header {
                margin-bottom: 4rem;
                padding: 0 1rem;
            }
            
            .nav-link {
                font-size: 0.9rem;
                padding: 6px 12px;
            }
        }

        /* Animated underscore cursor effect */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: #CBFF4D;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Fade in animation for content */
        .fade-in {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }

        .tooltip-trigger {
            position: relative;
            cursor: pointer;
            color: #CBFF4D;
            transition: color 0.2s;
        }

        .tooltip-trigger::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background-color: #CBFF4D;
            color: #080808;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, transform 0.3s;
            z-index: 10;
        }

        .tooltip-trigger:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-5px);
        }

        /* Optional arrow pointing down */
        .tooltip-trigger::before {
            content: "";
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            border-width: 5px;
            border-style: solid;
            border-color: #CBFF4D transparent transparent transparent;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, transform 0.3s;
            z-index: 10;
        }

        .tooltip-trigger:hover::before {
            opacity: 1;
            visibility: visible;
        }
